<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Soundboard</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            :root {
                --bg: #111;
                --s1: #191919;
                --s2: #1f1f1f;
                --bd: #252525;
                --bd2: #333;
                --txt: #e8e4da;
                --muted: #555;
                --dim: #333;
                --accent: #c43c10;
                --acc-txt: #f5ede8;
            }

            body {
                background: var(--bg);
                color: var(--txt);
                font-family: "Courier Prime", "Courier New", monospace;
                min-height: 100vh;
            }

            /* ─── TOPBAR ─────────────────────────────── */
            #bar {
                position: sticky;
                top: 0;
                z-index: 99;
                background: #0e0e0e;
                border-bottom: 1px solid var(--bd);
                display: flex;
                align-items: center;
                gap: 0;
                height: 48px;
                padding: 0;
                overflow: hidden;
            }

            #bar a.back {
                padding: 0 18px;
                height: 100%;
                display: flex;
                align-items: center;
                font-size: 13px;
                color: var(--muted);
                text-decoration: none;
                border-right: 1px solid var(--bd);
                white-space: nowrap;
                transition:
                    color 0.08s,
                    background 0.08s;
            }
            #bar a.back:hover {
                color: var(--txt);
                background: var(--s1);
            }

            #bar-title {
                padding: 0 20px;
                font-size: 16px;
                font-weight: 700;
                border-right: 1px solid var(--bd);
                white-space: nowrap;
                flex-shrink: 0;
            }

            #playing-strip {
                flex: 1;
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 0 16px;
                overflow: hidden;
                min-width: 0;
            }

            #playing-label {
                font-size: 11px;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--accent);
                flex-shrink: 0;
                display: none;
            }

            #playing-tags {
                display: flex;
                gap: 6px;
                overflow-x: auto;
                scrollbar-width: none;
                flex: 1;
            }
            #playing-tags::-webkit-scrollbar {
                display: none;
            }

            .ptag {
                font-size: 11px;
                padding: 3px 8px;
                background: #2a1008;
                border: 1px solid var(--accent);
                color: var(--acc-txt);
                white-space: nowrap;
                cursor: pointer;
                flex-shrink: 0;
                transition: background 0.08s;
            }
            .ptag:hover {
                background: #3d1710;
            }
            .ptag.fading {
                opacity: 0.45;
                border-style: dashed;
            }

            #stop-all {
                height: 100%;
                padding: 0 18px;
                background: none;
                border: none;
                border-left: 1px solid var(--bd);
                font-family: inherit;
                font-size: 12px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--accent);
                cursor: pointer;
                white-space: nowrap;
                transition:
                    background 0.08s,
                    color 0.08s;
                flex-shrink: 0;
            }
            #stop-all:hover:not(:disabled) {
                background: #2a1008;
            }
            #stop-all:disabled {
                color: var(--dim);
                cursor: default;
            }

            /* ─── CONTENT ────────────────────────────── */
            #content {
                max-width: 1120px;
                margin: 0 auto;
                padding: 40px 28px 80px;
            }

            /* ─── SCENE ──────────────────────────────── */
            .scene {
                margin-bottom: 44px;
            }

            .scene-head {
                display: flex;
                align-items: baseline;
                gap: 14px;
                margin-bottom: 14px;
                padding-bottom: 10px;
                border-bottom: 2px solid var(--bd2);
            }

            .scene-num {
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--accent);
                background: #1e0c05;
                border: 1px solid #3a1a0a;
                padding: 2px 8px;
                flex-shrink: 0;
            }

            .scene-title {
                font-size: 18px;
                font-weight: 700;
            }

            .scene-n {
                font-size: 12px;
                color: var(--dim);
                margin-left: auto;
            }

            /* ─── SOUND GRID ─────────────────────────── */
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
                gap: 6px;
            }

            /* ─── SOUND BUTTON ───────────────────────── */
            .snd {
                background: var(--s1);
                border: 1px solid var(--bd);
                display: flex;
                flex-direction: column;
                cursor: pointer;
                transition:
                    border-color 0.08s,
                    background 0.08s;
                min-height: 88px;
                position: relative;
                user-select: none;
            }

            .snd:hover {
                background: var(--s2);
                border-color: var(--bd2);
            }

            .snd.playing {
                background: var(--accent);
                border-color: var(--accent);
            }

            .snd.fading {
                background: #5c1c07;
                border-color: #7a2a0a;
            }

            .snd-main {
                flex: 1;
                display: flex;
                align-items: flex-start;
                gap: 10px;
                padding: 12px 13px 8px;
            }

            .snd-icon {
                font-size: 14px;
                color: var(--dim);
                flex-shrink: 0;
                padding-top: 1px;
                transition: color 0.08s;
                width: 16px;
                text-align: center;
            }

            .snd:hover .snd-icon {
                color: var(--muted);
            }
            .snd.playing .snd-icon {
                color: var(--acc-txt);
            }
            .snd.fading .snd-icon {
                color: #f09070;
            }

            .snd-lbl {
                font-size: 12px;
                line-height: 1.45;
                word-break: break-word;
                flex: 1;
                transition: color 0.08s;
            }

            .snd.playing .snd-lbl {
                color: var(--acc-txt);
                font-weight: 700;
            }
            .snd.fading .snd-lbl {
                color: #f09070;
            }

            .snd-foot {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 10px 8px 13px;
                gap: 6px;
            }

            .snd-state {
                font-size: 10px;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--dim);
                transition: color 0.08s;
            }

            .snd.playing .snd-state {
                color: rgba(245, 237, 232, 0.7);
            }
            .snd.fading .snd-state {
                color: #f09070;
            }

            .loop-tog {
                font-family: inherit;
                font-size: 10px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                background: none;
                border: 1px solid var(--bd2);
                color: var(--dim);
                padding: 2px 7px;
                cursor: pointer;
                transition: all 0.08s;
            }

            .loop-tog:hover {
                border-color: var(--muted);
                color: var(--txt);
            }

            .loop-tog.on {
                border-color: var(--acc-txt);
                color: var(--acc-txt);
                background: rgba(255, 255, 255, 0.07);
            }

            .snd.playing .loop-tog {
                border-color: rgba(245, 237, 232, 0.4);
                color: rgba(245, 237, 232, 0.7);
            }
            .snd.playing .loop-tog.on {
                border-color: var(--acc-txt);
                color: var(--acc-txt);
                background: rgba(255, 255, 255, 0.15);
            }

            .snd.fading .loop-tog {
                border-color: #7a4030;
                color: #f09070;
            }

            /* ─── MISC ───────────────────────────────── */
            .status {
                padding: 40px 0;
                font-size: 13px;
                color: var(--muted);
            }
            .err {
                padding: 16px 20px;
                border: 1px solid var(--accent);
                color: var(--accent);
                font-size: 13px;
                line-height: 1.7;
            }

            /* ─── ERROR STATES ───────────────────────── */
            .snd.broken {
                background: #1a1010;
                border-color: #5a2020;
                cursor: not-allowed;
                opacity: 0.7;
            }
            .snd.broken .snd-icon {
                color: #7a3030;
            }
            .snd.broken .snd-lbl {
                color: #996666;
                text-decoration: line-through;
            }
            .snd.broken .snd-state {
                color: #7a3030;
            }

            /* ─── WARNING BANNER ─────────────────────── */
            #warn-banner {
                background: #1c1005;
                border-bottom: 1px solid #7a4a10;
                padding: 10px 28px;
                font-size: 12px;
                color: #c8883a;
                line-height: 1.6;
                display: none;
            }
            #warn-banner strong {
                color: #e8a050;
            }
        </style>
    </head>
    <body>
        <div id="bar">
            <a class="back" href="index.html">← Boards</a>
            <div id="bar-title">—</div>
            <div id="playing-strip">
                <span id="playing-label">▶</span>
                <div id="playing-tags"></div>
            </div>
            <button id="stop-all" disabled>Stop all</button>
        </div>

        <div id="warn-banner"></div>
        <div id="content"><div class="status">Lade...</div></div>

        <script>
            const esc = (s) =>
                String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");

            // ─── Loop persistence ─────────────────────────────────
            const LOOP_KEY = (id) => `sb_loop_${id}`;

            function loadLoopState(boardId) {
                try {
                    return JSON.parse(
                        localStorage.getItem(LOOP_KEY(boardId)) || "{}",
                    );
                } catch {
                    return {};
                }
            }

            function saveLoopState(boardId) {
                const state = {};
                Object.entries(pool).forEach(([file, e]) => {
                    if (e.loop) state[file] = true;
                });
                try {
                    localStorage.setItem(
                        LOOP_KEY(boardId),
                        JSON.stringify(state),
                    );
                } catch {}
            }

            // ─── Auto-scene: collect all unique sounds from other scenes ──
            function buildAutoScene(scenes) {
                const seen = new Set();
                const sounds = [];
                scenes.forEach((s) => {
                    if (s.auto) return;
                    (s.sounds || []).forEach((snd) => {
                        if (!seen.has(snd.file)) {
                            seen.add(snd.file);
                            sounds.push(snd);
                        }
                    });
                });
                return sounds;
            }
            function checkCodecs() {
                const banner = document.getElementById("warn-banner");
                const t = document.createElement("audio");
                const flacOk =
                    t.canPlayType("audio/flac") ||
                    t.canPlayType("audio/x-flac");
                if (!flacOk) {
                    banner.style.display = "block";
                    banner.innerHTML = `<strong>⚠ FLAC nicht unterstützt</strong> — Dieser Browser kann .flac-Dateien nicht abspielen.
      Lösung: Dateien zu <strong>.mp3</strong> oder <strong>.ogg</strong> konvertieren, oder Chrome/Firefox verwenden.`;
                }
                const opusOk =
                    t.canPlayType("audio/ogg; codecs=opus") ||
                    t.canPlayType("audio/opus");
                if (!opusOk && !flacOk) {
                    banner.innerHTML +=
                        " &nbsp;|&nbsp; <strong>.opus</strong> ebenfalls nicht unterstützt.";
                }
            }

            // ─── Audio pool ──────────────────────────────────────
            const pool = {};

            function entry(file, audioPath) {
                if (!pool[file]) {
                    const a = new Audio(audioPath + encodeURIComponent(file));
                    a.preload = "auto";
                    pool[file] = {
                        audio: a,
                        loop: false,
                        fade: null,
                        cards: [],
                        broken: false,
                    };

                    a.addEventListener("ended", () => {
                        if (!a.loop) finish(file);
                    });

                    a.addEventListener("error", () => {
                        const e = pool[file];
                        if (e.broken) return;
                        e.broken = true;
                        e.cards.forEach((card) => {
                            card.classList.add("broken");
                            const state = card.querySelector(".snd-state");
                            const icon = card.querySelector(".snd-icon");
                            if (state) state.textContent = errMsg(a.error);
                            if (icon) icon.textContent = "✕";
                            const ltog = card.querySelector(".loop-tog");
                            if (ltog) ltog.style.display = "none";
                        });
                    });
                }
                return pool[file];
            }

            function errMsg(err) {
                if (!err) return "Fehler";
                switch (err.code) {
                    case 1:
                        return "Abgebrochen";
                    case 2:
                        return "Netzwerkfehler";
                    case 3:
                        return "Codec?"; // MEDIA_ERR_DECODE — most likely for FLAC
                    case 4:
                        return "Format?"; // MEDIA_ERR_SRC_NOT_SUPPORTED
                    default:
                        return "Fehler";
                }
            }

            function isOn(file) {
                const e = pool[file];
                return e && !e.audio.paused;
            }
            function isFading(file) {
                const e = pool[file];
                return e && e.fade !== null;
            }
            function isBroken(file) {
                const e = pool[file];
                return e && e.broken;
            }

            function play(file, audioPath) {
                if (isBroken(file)) return;
                const e = entry(file, audioPath);
                cancelFade(e);
                e.audio.volume = 1;
                e.audio.currentTime = 0;
                e.audio.loop = e.loop;
                e.audio.play().catch((err) => {
                    // NotAllowedError = no user gesture yet (shouldn't happen here), others = real errors
                    console.warn("play() rejected:", err.name, err.message);
                });
                sync(file);
                updateBar();
            }

            function stop(file, fade) {
                const e = pool[file];
                if (!e) return;
                cancelFade(e);
                if (!fade || e.audio.paused) {
                    finish(file);
                    return;
                }

                let v = e.audio.volume;
                const step = v / 40;
                e.fade = setInterval(() => {
                    v = Math.max(0, v - step);
                    e.audio.volume = v;
                    if (v <= 0) {
                        clearInterval(e.fade);
                        e.fade = null;
                        finish(file);
                    }
                }, 50);
                sync(file);
                updateBar();
            }

            function finish(file) {
                const e = pool[file];
                if (!e) return;
                e.audio.pause();
                e.audio.currentTime = 0;
                e.audio.volume = 1;
                sync(file);
                updateBar();
            }

            function cancelFade(e) {
                if (e.fade) {
                    clearInterval(e.fade);
                    e.fade = null;
                }
            }

            function toggleLoop(file, boardId) {
                const e = pool[file];
                if (!e) return;
                e.loop = !e.loop;
                e.audio.loop = e.loop;
                saveLoopState(boardId);
                sync(file);
            }

            function stopAll() {
                Object.keys(pool).forEach((f) => stop(f, true));
            }

            // ─── DOM sync ────────────────────────────────────────
            function sync(file) {
                const e = pool[file];
                if (!e) return;
                const on = !e.audio.paused;
                const fading = e.fade !== null;

                e.cards.forEach((card) => {
                    card.classList.toggle("playing", on && !fading);
                    card.classList.toggle("fading", fading);

                    const icon = card.querySelector(".snd-icon");
                    const state = card.querySelector(".snd-state");
                    const ltog = card.querySelector(".loop-tog");

                    if (icon) icon.textContent = on && !fading ? "■" : "▶";
                    if (state)
                        state.textContent = fading ? "fade…" : on ? "live" : "";
                    if (ltog) {
                        ltog.textContent = e.loop ? "↺ loop" : "loop";
                        ltog.classList.toggle("on", e.loop);
                    }
                });
            }

            function updateBar() {
                const tags = document.getElementById("playing-tags");
                const label = document.getElementById("playing-label");
                const btn = document.getElementById("stop-all");
                tags.innerHTML = "";

                const active = Object.entries(pool).filter(
                    ([, e]) => !e.audio.paused || e.fade,
                );
                label.style.display = active.length ? "block" : "none";
                btn.disabled = active.length === 0;

                active.forEach(([file, e]) => {
                    const lbl =
                        e.cards[0]?.querySelector(".snd-lbl")?.textContent ||
                        file;
                    const t = document.createElement("div");
                    t.className = "ptag" + (e.fade ? " fading" : "");
                    t.textContent = (e.loop ? "↺ " : "") + lbl;
                    t.title = "Stoppen";
                    t.onclick = () => stop(file, true);
                    tags.appendChild(t);
                });
            }

            // ─── Card factory ─────────────────────────────────────
            function makeCard(sound, audioPath, boardId) {
                const { file, label } = sound;
                const e = entry(file, audioPath);

                const card = document.createElement("div");
                card.className = "snd";
                card.innerHTML = `
    <div class="snd-main">
      <span class="snd-icon">▶</span>
      <span class="snd-lbl">${esc(label || file)}</span>
    </div>
    <div class="snd-foot">
      <span class="snd-state"></span>
      <button class="loop-tog">loop</button>
    </div>`;

                e.cards.push(card);

                card.querySelector(".snd-main").addEventListener(
                    "click",
                    () => {
                        if (isBroken(file)) return;
                        isOn(file) || isFading(file)
                            ? stop(file, true)
                            : play(file, audioPath);
                    },
                );

                card.querySelector(".loop-tog").addEventListener(
                    "click",
                    (ev) => {
                        ev.stopPropagation();
                        toggleLoop(file, boardId);
                    },
                );

                return card;
            }

            // ─── Load & render ────────────────────────────────────
            async function init() {
                checkCodecs();
                const content = document.getElementById("content");
                const params = new URLSearchParams(location.search);
                const id = params.get("id");

                if (!id) {
                    content.innerHTML =
                        '<div class="err">Kein Board-ID. <a href="index.html" style="color:inherit">← Zurück</a></div>';
                    return;
                }

                let cfg;
                try {
                    cfg = await fetch("config.json").then((r) => r.json());
                } catch (e) {
                    content.innerHTML = `<div class="err">${esc(e.message)}</div>`;
                    return;
                }

                const board = cfg.boards?.find((b) => b.id === id);
                if (!board) {
                    content.innerHTML = `<div class="err">Board "${esc(id)}" nicht gefunden.</div>`;
                    return;
                }

                document.title = board.title + " – Soundboard";
                document.getElementById("bar-title").textContent = board.title;

                const audioPath = board.audioPath || `audio/${board.id}/`;
                const savedLoop = loadLoopState(board.id);
                content.innerHTML = "";

                // Resolve auto scenes before rendering
                const scenes = (board.scenes || []).map((scene) => {
                    if (!scene.auto) return scene;
                    return {
                        ...scene,
                        sounds: buildAutoScene(board.scenes || []),
                    };
                });

                scenes.forEach((scene) => {
                    const sec = document.createElement("section");
                    sec.className = "scene";

                    const head = document.createElement("div");
                    head.className = "scene-head";
                    head.innerHTML = `
      <span class="scene-num">Sz. ${esc(String(scene.number))}</span>
      <span class="scene-title">${esc(scene.name || "")}</span>
      <span class="scene-n">${scene.sounds?.length || 0}</span>`;
                    sec.appendChild(head);

                    const grid = document.createElement("div");
                    grid.className = "grid";
                    (scene.sounds || []).forEach((s) => {
                        // Apply saved loop state before card is created
                        const e = entry(s.file, audioPath);
                        if (savedLoop[s.file]) {
                            e.loop = true;
                            e.audio.loop = true;
                        }
                        grid.appendChild(makeCard(s, audioPath, board.id));
                    });
                    sec.appendChild(grid);
                    content.appendChild(sec);
                });

                // Sync all cards to reflect restored loop state
                Object.keys(pool).forEach(sync);

                document
                    .getElementById("stop-all")
                    .addEventListener("click", stopAll);
            }

            init();
        </script>
    </body>
</html>
