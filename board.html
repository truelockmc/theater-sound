<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Soundboard</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            :root {
                --font: "Courier New", Courier, ui-monospace, monospace;
                --bg: #0c0c0c;
                --card: #252525;
                --card-h: #2e2e2e;
                --bd: #404040;
                --bd2: #555;
                --txt: #f0ece0;
                --muted: #888;
                --dim: #555;
                --accent: #c43c10;
                --acc-txt: #fdf0ea;
                --fade-bg: #5c1c07;
                --fade-bd: #8a3010;
            }

            body {
                background: var(--bg);
                color: var(--txt);
                font-family: "Courier New", Courier, ui-monospace, monospace;
                min-height: 100vh;
            }

            /* ─── TOPBAR ─────────────────────────── */
            #bar {
                position: sticky;
                top: 0;
                z-index: 99;
                background: #080808;
                border-bottom: 2px solid var(--bd);
                display: flex;
                align-items: stretch;
                height: 52px;
            }

            #bar a.back {
                padding: 0 20px;
                display: flex;
                align-items: center;
                font-size: 15px;
                color: var(--muted);
                text-decoration: none;
                border-right: 1px solid var(--bd);
                white-space: nowrap;
                transition:
                    color 0.08s,
                    background 0.08s;
            }
            #bar a.back:hover {
                color: var(--txt);
                background: var(--card);
            }

            #bar-title {
                padding: 0 20px;
                font-size: 18px;
                font-weight: 700;
                display: flex;
                align-items: center;
                border-right: 1px solid var(--bd);
                white-space: nowrap;
                flex-shrink: 0;
            }

            #playing-strip {
                flex: 1;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 0 16px;
                overflow: hidden;
                min-width: 0;
            }

            #playing-label {
                font-size: 12px;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: var(--accent);
                flex-shrink: 0;
                display: none;
            }

            #playing-tags {
                display: flex;
                gap: 6px;
                overflow-x: auto;
                scrollbar-width: none;
                flex: 1;
            }
            #playing-tags::-webkit-scrollbar {
                display: none;
            }

            .ptag {
                font-size: 12px;
                padding: 4px 10px;
                background: #2a1008;
                border: 1px solid var(--accent);
                color: var(--acc-txt);
                white-space: nowrap;
                cursor: pointer;
                flex-shrink: 0;
                transition: background 0.08s;
            }
            .ptag:hover {
                background: #3d1710;
            }
            .ptag.fading {
                opacity: 0.5;
                border-style: dashed;
            }

            #stop-all {
                padding: 0 20px;
                background: none;
                border: none;
                border-left: 1px solid var(--bd);
                font-family: inherit;
                font-size: 13px;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--accent);
                cursor: pointer;
                white-space: nowrap;
                transition: background 0.08s;
                flex-shrink: 0;
            }
            #stop-all:hover:not(:disabled) {
                background: #2a1008;
            }
            #stop-all:disabled {
                color: var(--dim);
                cursor: default;
            }

            /* ─── WARN BANNER ────────────────────── */
            #warn-banner {
                background: #1c1005;
                border-bottom: 1px solid #7a4a10;
                padding: 10px 24px;
                font-size: 13px;
                color: #c8883a;
                line-height: 1.6;
                display: none;
            }
            #warn-banner strong {
                color: #e8a050;
            }

            /* ─── CONTENT ────────────────────────── */
            #content {
                max-width: 1200px;
                margin: 0 auto;
                padding: 36px 24px 80px;
            }

            /* ─── SCENE ──────────────────────────── */
            .scene {
                margin-bottom: 48px;
            }

            .scene-head {
                display: flex;
                align-items: baseline;
                gap: 16px;
                margin-bottom: 14px;
                padding-bottom: 12px;
                border-bottom: 2px solid var(--bd);
            }

            .scene-num {
                font-size: 13px;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--accent);
                background: #1e0c05;
                border: 1px solid #5a2010;
                padding: 3px 10px;
                flex-shrink: 0;
            }

            .scene-title {
                font-size: 22px;
                font-weight: 700;
            }

            .scene-n {
                font-size: 13px;
                color: var(--dim);
                margin-left: auto;
            }

            /* ─── GRID ───────────────────────────── */
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 8px;
            }

            /* ─── SOUND CARD ─────────────────────── */
            .snd {
                background: var(--card);
                border: 2px solid var(--bd);
                display: flex;
                flex-direction: column;
                cursor: pointer;
                min-height: 110px;
                user-select: none;
                transition:
                    border-color 0.08s,
                    background 0.08s;
            }

            .snd:hover {
                background: var(--card-h);
                border-color: var(--bd2);
            }
            .snd.playing {
                background: var(--accent);
                border-color: var(--accent);
            }
            .snd.fading {
                background: var(--fade-bg);
                border-color: var(--fade-bd);
            }
            .snd.broken {
                background: #1a1010;
                border-color: #5a2020;
                cursor: not-allowed;
                opacity: 0.6;
            }

            /* main click area */
            .snd-main {
                flex: 1;
                display: flex;
                align-items: flex-start;
                gap: 12px;
                padding: 14px 14px 10px;
            }

            .snd-icon {
                font-size: 16px;
                color: var(--muted);
                flex-shrink: 0;
                padding-top: 2px;
                width: 18px;
                text-align: center;
                transition: color 0.08s;
            }

            .snd:hover .snd-icon {
                color: var(--txt);
            }
            .snd.playing .snd-icon {
                color: var(--acc-txt);
            }
            .snd.fading .snd-icon {
                color: #f09070;
            }
            .snd.broken .snd-icon {
                color: #7a3030;
            }

            .snd-lbl {
                font-size: 15px;
                line-height: 1.4;
                word-break: break-word;
                flex: 1;
                transition: color 0.08s;
            }

            .snd.playing .snd-lbl {
                color: var(--acc-txt);
                font-weight: 700;
            }
            .snd.fading .snd-lbl {
                color: #f09070;
            }
            .snd.broken .snd-lbl {
                color: #886666;
                text-decoration: line-through;
            }

            /* bottom row */
            .snd-foot {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 10px 10px 14px;
                gap: 8px;
            }

            .snd-state {
                font-size: 11px;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--dim);
                transition: color 0.08s;
            }
            .snd.playing .snd-state {
                color: rgba(253, 240, 234, 0.6);
            }
            .snd.fading .snd-state {
                color: #f09070;
            }

            .loop-tog {
                font-family: inherit;
                font-size: 12px;
                letter-spacing: 0.06em;
                background: none;
                border: 1px solid var(--bd2);
                color: var(--dim);
                padding: 4px 10px;
                cursor: pointer;
                transition: all 0.08s;
            }
            .loop-tog:hover {
                border-color: var(--muted);
                color: var(--txt);
                background: rgba(255, 255, 255, 0.04);
            }
            .loop-tog.on {
                border-color: var(--txt);
                color: var(--txt);
                background: rgba(255, 255, 255, 0.08);
            }
            .snd.playing .loop-tog {
                border-color: rgba(253, 240, 234, 0.4);
                color: rgba(253, 240, 234, 0.7);
            }
            .snd.playing .loop-tog.on {
                border-color: var(--acc-txt);
                color: var(--acc-txt);
                background: rgba(255, 255, 255, 0.15);
            }
            .snd.fading .loop-tog {
                border-color: #7a4030;
                color: #f09070;
            }

            /* ─── MISC ───────────────────────────── */
            .status {
                padding: 40px 0;
                font-size: 14px;
                color: var(--muted);
            }
            .err {
                padding: 16px 20px;
                border: 1px solid var(--accent);
                color: var(--accent);
                font-size: 14px;
                line-height: 1.7;
            }

            /* ─── RESPONSIVE ─────────────────────── */
            @media (max-width: 600px) {
                #bar-title {
                    font-size: 16px;
                    padding: 0 14px;
                }
                #bar a.back {
                    font-size: 14px;
                    padding: 0 14px;
                }
                #content {
                    padding: 24px 12px 60px;
                }
                .scene-title {
                    font-size: 19px;
                }
                .grid {
                    grid-template-columns: repeat(
                        auto-fill,
                        minmax(160px, 1fr)
                    );
                    gap: 6px;
                }
                .snd-lbl {
                    font-size: 14px;
                }
                .snd {
                    min-height: 100px;
                }
            }
        </style>
    </head>
    <body>
        <div id="bar">
            <a class="back" href="index.html">← Boards</a>
            <div id="bar-title">—</div>
            <div id="playing-strip">
                <span id="playing-label">▶</span>
                <div id="playing-tags"></div>
            </div>
            <button id="stop-all" disabled>Stop all</button>
        </div>

        <div id="warn-banner"></div>
        <div id="content"><div class="status">Lade...</div></div>

        <script>
            const esc = (s) =>
                String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");

            // ─── Codec check ──────────────────────────────────────
            function checkCodecs() {
                const banner = document.getElementById("warn-banner");
                const t = document.createElement("audio");
                const flacOk =
                    t.canPlayType("audio/flac") ||
                    t.canPlayType("audio/x-flac");
                const opusOk =
                    t.canPlayType("audio/ogg; codecs=opus") ||
                    t.canPlayType("audio/opus");
                const msgs = [];
                if (!flacOk)
                    msgs.push(
                        "<strong>.flac</strong> nicht unterstützt — bitte zu .ogg/.mp3 konvertieren oder Chrome/Firefox verwenden",
                    );
                if (!opusOk)
                    msgs.push("<strong>.opus</strong> nicht unterstützt");
                if (msgs.length) {
                    banner.style.display = "block";
                    banner.innerHTML = "⚠ " + msgs.join(" &nbsp;|&nbsp; ");
                }
            }

            // ─── Auto-scene ───────────────────────────────────────
            function buildAutoScene(scenes) {
                const seen = new Set(),
                    sounds = [];
                scenes.forEach((s) => {
                    if (s.auto) return;
                    (s.sounds || []).forEach((snd) => {
                        if (!seen.has(snd.file)) {
                            seen.add(snd.file);
                            sounds.push(snd);
                        }
                    });
                });
                return sounds;
            }

            // ─── Audio pool ───────────────────────────────────────
            const pool = {};

            function entry(file, audioPath, defaultLoop) {
                if (!pool[file]) {
                    const a = new Audio(audioPath + encodeURIComponent(file));
                    a.preload = "auto";
                    pool[file] = {
                        audio: a,
                        loop: !!defaultLoop,
                        fade: null,
                        cards: [],
                        broken: false,
                    };
                    a.loop = !!defaultLoop;
                    a.addEventListener("ended", () => {
                        if (!a.loop) finish(file);
                    });
                    a.addEventListener("error", () => {
                        const e = pool[file];
                        if (e.broken) return;
                        e.broken = true;
                        e.cards.forEach((card) => {
                            card.classList.add("broken");
                            const st = card.querySelector(".snd-state");
                            const ic = card.querySelector(".snd-icon");
                            const lt = card.querySelector(".loop-tog");
                            if (st) st.textContent = errMsg(a.error);
                            if (ic) ic.textContent = "✕";
                            if (lt) lt.style.display = "none";
                        });
                    });
                }
                return pool[file];
            }

            function errMsg(err) {
                if (!err) return "Fehler";
                return (
                    ["", "Abgebrochen", "Netzwerk", "Codec?", "Format?"][
                        err.code
                    ] || "Fehler"
                );
            }

            const isOn = (f) => {
                const e = pool[f];
                return e && !e.audio.paused;
            };
            const isFading = (f) => {
                const e = pool[f];
                return e && e.fade !== null;
            };
            const isBroken = (f) => {
                const e = pool[f];
                return e && e.broken;
            };

            function play(file, audioPath) {
                if (isBroken(file)) return;
                const e = entry(file, audioPath);
                cancelFade(e);
                e.audio.volume = 1;
                e.audio.currentTime = 0;
                e.audio.loop = e.loop;
                e.audio
                    .play()
                    .catch((err) => console.warn("play():", err.name));
                sync(file);
                updateBar();
            }

            function stop(file, fade) {
                const e = pool[file];
                if (!e) return;
                cancelFade(e);
                if (!fade || e.audio.paused) {
                    finish(file);
                    return;
                }
                let v = e.audio.volume;
                const step = v / 40;
                e.fade = setInterval(() => {
                    v = Math.max(0, v - step);
                    e.audio.volume = v;
                    if (v <= 0) {
                        clearInterval(e.fade);
                        e.fade = null;
                        finish(file);
                    }
                }, 50);
                sync(file);
                updateBar();
            }

            function finish(file) {
                const e = pool[file];
                if (!e) return;
                e.audio.pause();
                e.audio.currentTime = 0;
                e.audio.volume = 1;
                sync(file);
                updateBar();
            }

            function cancelFade(e) {
                if (e.fade) {
                    clearInterval(e.fade);
                    e.fade = null;
                }
            }

            function toggleLoop(file) {
                const e = pool[file];
                if (!e) return;
                e.loop = !e.loop;
                e.audio.loop = e.loop;
                sync(file);
            }

            function stopAll() {
                Object.keys(pool).forEach((f) => stop(f, true));
            }

            // ─── DOM sync ─────────────────────────────────────────
            function sync(file) {
                const e = pool[file];
                if (!e) return;
                const on = !e.audio.paused,
                    fading = e.fade !== null;
                e.cards.forEach((card) => {
                    card.classList.toggle("playing", on && !fading);
                    card.classList.toggle("fading", fading);
                    const icon = card.querySelector(".snd-icon");
                    const st = card.querySelector(".snd-state");
                    const lt = card.querySelector(".loop-tog");
                    if (icon) icon.textContent = on && !fading ? "■" : "▶";
                    if (st)
                        st.textContent = fading ? "fade…" : on ? "live" : "";
                    if (lt) {
                        lt.textContent = e.loop ? "↺ loop" : "loop";
                        lt.classList.toggle("on", e.loop);
                    }
                });
            }

            function updateBar() {
                const tags = document.getElementById("playing-tags");
                const label = document.getElementById("playing-label");
                const btn = document.getElementById("stop-all");
                tags.innerHTML = "";
                const active = Object.entries(pool).filter(
                    ([, e]) => !e.audio.paused || e.fade,
                );
                label.style.display = active.length ? "block" : "none";
                btn.disabled = !active.length;
                active.forEach(([file, e]) => {
                    const lbl =
                        e.cards[0]?.querySelector(".snd-lbl")?.textContent ||
                        file;
                    const t = document.createElement("div");
                    t.className = "ptag" + (e.fade ? " fading" : "");
                    t.textContent = (e.loop ? "↺ " : "") + lbl;
                    t.title = "Stoppen";
                    t.onclick = () => stop(file, true);
                    tags.appendChild(t);
                });
            }

            // ─── Card factory ─────────────────────────────────────
            function makeCard(sound, audioPath) {
                const { file, label } = sound;
                const e = entry(file, audioPath, sound.loop);

                const card = document.createElement("div");
                card.className = "snd";
                card.innerHTML = `
      <div class="snd-main">
        <span class="snd-icon">▶</span>
        <span class="snd-lbl">${esc(label || file)}</span>
      </div>
      <div class="snd-foot">
        <span class="snd-state"></span>
        <button class="loop-tog">${e.loop ? "↺ loop" : "loop"}</button>
      </div>`;

                if (e.loop) card.querySelector(".loop-tog").classList.add("on");
                e.cards.push(card);

                card.querySelector(".snd-main").addEventListener(
                    "click",
                    () => {
                        if (isBroken(file)) return;
                        isOn(file) || isFading(file)
                            ? stop(file, true)
                            : play(file, audioPath);
                    },
                );

                card.querySelector(".loop-tog").addEventListener(
                    "click",
                    (ev) => {
                        ev.stopPropagation();
                        toggleLoop(file);
                    },
                );

                return card;
            }

            // ─── Init ─────────────────────────────────────────────
            async function init() {
                checkCodecs();
                const content = document.getElementById("content");
                const id = new URLSearchParams(location.search).get("id");

                if (!id) {
                    content.innerHTML =
                        '<div class="err">Kein Board-ID. <a href="index.html" style="color:inherit">← Zurück</a></div>';
                    return;
                }

                let cfg;
                try {
                    cfg = await fetch("config.json").then((r) => r.json());
                } catch (e) {
                    content.innerHTML = `<div class="err">${esc(e.message)}</div>`;
                    return;
                }

                const board = cfg.boards?.find((b) => b.id === id);
                if (!board) {
                    content.innerHTML = `<div class="err">Board "${esc(id)}" nicht gefunden.</div>`;
                    return;
                }

                document.title = board.title + " – Soundboard";
                document.getElementById("bar-title").textContent = board.title;

                const audioPath = board.audioPath || `audio/${board.id}/`;
                content.innerHTML = "";

                const scenes = (board.scenes || []).map((s) =>
                    s.auto ? { ...s, sounds: buildAutoScene(board.scenes) } : s,
                );

                scenes.forEach((scene) => {
                    const sec = document.createElement("section");
                    sec.className = "scene";

                    const head = document.createElement("div");
                    head.className = "scene-head";
                    head.innerHTML = `
        <span class="scene-num">Sz. ${esc(String(scene.number))}</span>
        <span class="scene-title">${esc(scene.name || "")}</span>
        <span class="scene-n">${scene.sounds?.length || 0}</span>`;
                    sec.appendChild(head);

                    const grid = document.createElement("div");
                    grid.className = "grid";
                    (scene.sounds || []).forEach((s) =>
                        grid.appendChild(makeCard(s, audioPath)),
                    );
                    sec.appendChild(grid);
                    content.appendChild(sec);
                });

                document
                    .getElementById("stop-all")
                    .addEventListener("click", stopAll);
            }

            init();
        </script>
    </body>
</html>
