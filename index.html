<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Soundboard</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: #111;
                color: #e8e4da;
                font-family: "Courier Prime", "Courier New", monospace;
                min-height: 100vh;
            }

            .wrap {
                max-width: 780px;
                margin: 0 auto;
                padding: 64px 32px 80px;
            }

            header {
                margin-bottom: 56px;
                padding-bottom: 28px;
                border-bottom: 1px solid #2a2a2a;
            }

            header p {
                font-size: 12px;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                color: #555;
                margin-bottom: 10px;
            }

            header h1 {
                font-size: 40px;
                font-weight: 700;
                line-height: 1;
                letter-spacing: -0.01em;
            }

            #list {
                display: flex;
                flex-direction: column;
                gap: 2px;
            }

            a.row {
                display: grid;
                grid-template-columns: 32px 1fr auto auto 24px;
                align-items: center;
                gap: 20px;
                padding: 18px 20px;
                background: #191919;
                border: 1px solid #222;
                text-decoration: none;
                color: inherit;
                transition:
                    border-color 0.08s,
                    background 0.08s;
            }
            a.row:hover {
                background: #1e1e1e;
                border-color: #c43c10;
            }
            a.row:hover .arr {
                color: #c43c10;
            }

            .idx {
                font-size: 12px;
                color: #3a3a3a;
            }
            .name {
                font-size: 20px;
                font-weight: 700;
            }
            .desc {
                font-size: 13px;
                color: #555;
            }
            .meta {
                font-size: 12px;
                color: #444;
                white-space: nowrap;
                text-align: right;
            }
            .arr {
                font-size: 16px;
                color: #3a3a3a;
                transition: color 0.08s;
                text-align: right;
            }

            .status {
                font-size: 13px;
                color: #555;
                padding: 24px 0;
            }
            .err {
                padding: 16px 20px;
                border: 1px solid #c43c10;
                color: #c43c10;
                font-size: 13px;
                line-height: 1.7;
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <header>
                <p>Ton-Regie</p>
                <h1>Soundboard</h1>
            </header>
            <div id="list"><span class="status">Lade...</span></div>
        </div>
        <script>
            const esc = (s) =>
                String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");

            fetch("config.json")
                .then((r) => r.json())
                .then((cfg) => {
                    const list = document.getElementById("list");
                    if (!cfg.boards?.length) {
                        list.innerHTML =
                            '<span class="status">Keine Boards.</span>';
                        return;
                    }
                    list.innerHTML = "";
                    cfg.boards.forEach((b, i) => {
                        const sounds = (b.scenes || []).reduce(
                            (n, s) => n + (s.sounds?.length || 0),
                            0,
                        );
                        const el = document.createElement("a");
                        el.className = "row";
                        el.href = `board.html?id=${encodeURIComponent(b.id)}`;
                        el.innerHTML = `
        <span class="idx">0${i + 1}</span>
        <span class="name">${esc(b.title)}</span>
        <span class="desc">${esc(b.description || "")}</span>
        <span class="meta">${b.scenes?.length || 0} Sz. &nbsp; ${sounds} Sounds</span>
        <span class="arr">→</span>`;
                        list.appendChild(el);
                    });
                })
                .catch((e) => {
                    document.getElementById("list").innerHTML =
                        `<div class="err">config.json nicht geladen: ${esc(e.message)}<br>Lokaler HTTP-Server nötig (nicht file://)</div>`;
                });
        </script>
    </body>
</html>
